<!DOCTYPE html>
<html lang="{{ lang_code }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.m("app.title") }}</title>
  <link rel="stylesheet" href="/assets/uplot.min.css">
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/htmx.min.js" defer></script>
  <script src="/assets/uplot.iife.min.js"></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">⛽ {{ t.m("app.title") }}</a>
  <nav class="lang-switch">
    <a href="/lang/de" {% if lang_code == "de" %}class="active"{% endif %}>DE</a>
    <a href="/lang/en" {% if lang_code == "en" %}class="active"{% endif %}>EN</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
