[package]
name = "spritmonitor-stats"
version = "0.1.0"
edition = "2021"
description = "Vehicle statistics dashboard for Spritmonitor.de CSV exports"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "trace", "limit"] }
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }
csv = "1.3"
encoding_rs = "0.8"
rust_decimal = "1"
jiff = "0.2"
rust-i18n = "3"
moka = { version = "0.12", features = ["sync"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
