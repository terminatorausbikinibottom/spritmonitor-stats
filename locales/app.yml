warning.preamble:
  en: "Lines before the header row were ignored."
  de: "Zeilen vor der Kopfzeile wurden ignoriert."
warning.unknown_column:
  en: "Unknown column \"%{name}\" was ignored."
  de: "Unbekannte Spalte \"%{name}\" wurde ignoriert."
warning.row_skipped:
  en: "Row skipped — unreadable date \"%{value}\"."
  de: "Zeile übersprungen — unlesbares Datum \"%{value}\"."
warning.bad_value:
  en: "Unreadable value \"%{value}\" in column %{column} was treated as empty."
  de: "Unlesbarer Wert \"%{value}\" in Spalte %{column} wurde als leer behandelt."
warning.odometer_reconstructed:
  en: "Missing odometer reading reconstructed from the trip distance."
  de: "Fehlender Kilometerstand aus der Strecke rekonstruiert."
warning.odometer_backwards:
  en: "Odometer reading goes backwards and was discarded."
  de: "Kilometerstand läuft rückwärts und wurde verworfen."

