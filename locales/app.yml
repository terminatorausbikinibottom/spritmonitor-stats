app.title:
  en: "Spritmonitor Statistics"
  de: "Spritmonitor-Statistik"
nav.upload_new:
  en: "Upload another file"
  de: "Andere Datei laden"

index.headline:
  en: "Vehicle statistics from your Spritmonitor export"
  de: "Fahrzeugstatistik aus deinem Spritmonitor-Export"
index.sub:
  en: "Drop the CSV export of your fuelings and get mileage estimates for your insurance, consumption trends and cost analysis. Nothing is stored on the server."
  de: "Zieh den CSV-Export deiner Betankungen hierher und erhalte Laufleistungs-Schätzungen für die Versicherung, Verbrauchstrends und Kostenanalysen. Auf dem Server wird nichts gespeichert."
index.drop_hint:
  en: "Drop your CSV file here or click to choose"
  de: "CSV-Datei hier ablegen oder klicken zum Auswählen"
index.submit:
  en: "Show statistics"
  de: "Statistik anzeigen"
index.expired:
  en: "Your session has expired — please drop your file again."
  de: "Deine Sitzung ist abgelaufen — bitte lade die Datei erneut."
index.export_hint:
  en: "Export at spritmonitor.de: vehicle → fuelings → CSV export."
  de: "Export auf spritmonitor.de: Fahrzeug → Betankungen → CSV-Export."

error.no_header:
  en: "No recognizable header row found — is this a Spritmonitor fueling export?"
  de: "Keine erkennbare Kopfzeile gefunden — ist das ein Spritmonitor-Betankungsexport?"
error.no_rows:
  en: "The file contains no readable fueling rows."
  de: "Die Datei enthält keine lesbaren Betankungszeilen."
error.csv:
  en: "The file could not be parsed as CSV."
  de: "Die Datei konnte nicht als CSV gelesen werden."
error.too_large:
  en: "The file is too large."
  de: "Die Datei ist zu groß."
error.no_file:
  en: "No file received — please choose a CSV file."
  de: "Keine Datei empfangen — bitte eine CSV-Datei auswählen."

